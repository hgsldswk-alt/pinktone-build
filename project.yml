name: PinkTone
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
  knownRegions: [ja, en, zh-Hans, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.pinktone
    APP_STORE_ID: "__APP_STORE_ID__"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  PinkTone:
    type: application
    platform: iOS
    sources: [PinkTone, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: PinkTone AppStore
    info:
      path: PinkTone/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: ピンク加工
        CFBundleDevelopmentRegion: ja
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        APP_STORE_ID: $(APP_STORE_ID)
        NSPhotoLibraryAddUsageDescription: 加工した写真を写真アプリに追加します。
  PinkToneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PinkToneTests
        excludes: [Fixtures]
      - path: PinkToneTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: PinkTone
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PinkTone.app/PinkTone
        BUNDLE_LOADER: $(TEST_HOST)
  PinkToneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PinkToneUITests]
    dependencies:
      - target: PinkTone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PinkTone
schemes:
  PinkTone:
    build:
      targets:
        PinkTone: all
        PinkToneTests: [test]
    run:
      storeKitConfiguration: PinkToneTests/Fixtures/PinkTone.storekit
    test:
      config: Debug
      targets: [PinkToneTests]
      environmentVariables:
        PINKTONE_HOSTED_TESTS: "1"
  PinkToneUI:
    build:
      targets:
        PinkTone: all
        PinkToneUITests: [test]
    test:
      config: Debug
      targets: [PinkToneUITests]
